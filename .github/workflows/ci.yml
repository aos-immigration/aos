name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup
        run: bun run setup

      - name: Check
        run: bun run check

      - name: Render PDF crops
        working-directory: apps/api
        run: uv run python scripts/render_fields.py fixtures/basic_petitioner.json --pages --out "$GITHUB_WORKSPACE/pdf-crops"

      - name: Upload PDF crops
        uses: actions/upload-artifact@v4
        with:
          name: pdf-crops
          path: pdf-crops
          if-no-files-found: error
