[project]
name = "aos-api"
version = "0.1.0"
description = "FastAPI service for AOS PDF parsing and filling"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "ipykernel==6.29.5",
  "cryptography==42.0.8",
  "pikepdf==10.2.0",
  "pypdf==5.1.0",
  "uvicorn[standard]==0.32.1",
]

[dependency-groups]
dev = [
  "pypdfium2==4.30.1",
  "pillow==11.1.0",
  "pytest>=9.1.1",
  "httpx>=0.28.1",
  "pyright>=1.1.414",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.pyright]
include = ["app", "tests", "scripts"]
extraPaths = ["."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
